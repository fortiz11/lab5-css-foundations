<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab 5 - Login Page</title>
<link rel="stylesheet" href="styles.css">
<!--This is for mobile device lay out-->
<meta name="viewport" content="width=device-width initial-scale=1.0">
</head>
<body>
  <!-- Francis Ortiz - Lab 5 -->
<!--Left panel layout-->
  
  <main class="layout">
    <aside class="brand-panel">
      <div class="brand-panel__inner">
        <h2 class="brand-title">Super Ai Dash </h2>
        <p class="brand-subtitle">Ai powered finance from Apes, alt-coins, and fiat currency, we promise you wont 
          lose <em>all</em> of it. </p>
          </div>
          </aside>

  <section class="auth-panel">
    <h2 class="visually-hidden">Login Form</h2>
  <div class="auth-card">
    <form class="auth-form" action="#" method="post">
      <div class="field">
        <label for="email">Email Address</label>
        <input id="email" name="'email" type="email" placeholder="you@example.com"
        required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          required
        >
      </div>
      <div class="field field--actions">
        <button class="btn btn--primary" type="submit">Sign In</button>
        <a href="#" class="link link--subtle">Forgot password?</a>
      </div>
    </form>
  </div>
</section>
</main>
</body>
</html>
